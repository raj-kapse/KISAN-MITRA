<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Four step flow: photograph a leaf, get a diagnosis, get weather-aware treatment, hear and share the advice">
  <rect width="1200" height="250" fill="#F7F6F2" />

  <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#16301F">From leaf photo to action, in four steps</text>

  <!-- Step 1 -->
  <rect x="24" y="58" width="266" height="164" rx="14" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="2" />
  <circle cx="56" cy="90" r="17" fill="#B45309" />
  <text x="56" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="84" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F1E1A">Point at the leaf</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#565249">
    <text x="44" y="132">Rear camera, gallery upload,</text>
    <text x="44" y="153">or one of three sample leaf</text>
    <text x="44" y="174">photos bundled in the app for</text>
    <text x="44" y="195">judging and offline demos.</text>
  </g>

  <!-- arrow -->
  <line x1="294" y1="140" x2="318" y2="140" stroke="#8E3D2C" stroke-width="4" />
  <polygon points="318,132 334,140 318,148" fill="#8E3D2C" />

  <!-- Step 2 -->
  <rect x="338" y="58" width="266" height="164" rx="14" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="2" />
  <circle cx="370" cy="90" r="17" fill="#B45309" />
  <text x="370" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text x="398" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F1E1A">Get the diagnosis</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#565249">
    <text x="358" y="132">A vision model returns strict</text>
    <text x="358" y="153">JSON: crop, disease name,</text>
    <text x="358" y="174">confidence, severity, symptoms</text>
    <text x="358" y="195">and a numbered action plan.</text>
  </g>

  <!-- arrow -->
  <line x1="608" y1="140" x2="632" y2="140" stroke="#8E3D2C" stroke-width="4" />
  <polygon points="632,132 648,140 632,148" fill="#8E3D2C" />

  <!-- Step 3 -->
  <rect x="652" y="58" width="266" height="164" rx="14" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="2" />
  <circle cx="684" cy="90" r="17" fill="#B45309" />
  <text x="684" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text x="712" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F1E1A">Treat it sensibly</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#565249">
    <text x="672" y="132">Chemical, organic and</text>
    <text x="672" y="153">preventive options with</text>
    <text x="672" y="174">dosages, plus advice fused</text>
    <text x="672" y="195">with the local forecast.</text>
  </g>

  <!-- arrow -->
  <line x1="922" y1="140" x2="946" y2="140" stroke="#8E3D2C" stroke-width="4" />
  <polygon points="946,132 962,140 946,148" fill="#8E3D2C" />

  <!-- Step 4 -->
  <rect x="966" y="58" width="210" height="164" rx="14" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="2" />
  <circle cx="998" cy="90" r="17" fill="#B45309" />
  <text x="998" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1026" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F1E1A">Hear &#38; share</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#565249">
    <text x="986" y="132">Read aloud in the chosen</text>
    <text x="986" y="153">language, then send the</text>
    <text x="986" y="174">report to an extension</text>
    <text x="986" y="195">officer or print it.</text>
  </g>
</svg>
